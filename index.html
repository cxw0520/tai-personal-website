<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>態度貳貳甜點店營運系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            50: '#FDFBF7',
                            100: '#D7CCC8',
                            200: '#BCAAA4',
                            300: '#A1887F',
                            400: '#8D6E63',
                            500: '#6D4C41',
                            600: '#5D2E17',
                            700: '#4E342E',
                            800: '#3E2723',
                            900: '#2D1B18',
                        },
                        cream: '#FFFDF5',
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        :root {
            --primary: #ff8fa3;
            --primary-light: #ffb3c1;
            --secondary: #ffcbf2;
            --accent: #83c5be;
            --success: #2b9348;
            --danger: #ef233c;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #fff0f3 100%);
            min-height: 100vh;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            box-shadow: 0 8px 24px rgba(255, 143, 163, 0.15);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .mobile-table {
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .mobile-table {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useEffect, useMemo, useRef, useState } = React;

        const YEAR_OPTIONS = [2026, 2027, 2028, 2029, 2030, 2031];
        const OWNER_EMAIL = 'taidu.patisserie.2025@gmail.com';
        const STORAGE_KEY = 'taidu_ops_v2';
        const EMPTY_FIREBASE_CONFIG = {
            apiKey: '',
            authDomain: '',
            projectId: '',
            storageBucket: '',
            messagingSenderId: '',
            appId: '',
        };

        const DEFAULT_COA = [
            { id: '1101', name: '現金', type: '資產', side: 'debit' },
            { id: '1102', name: '銀行存款', type: '資產', side: 'debit' },
            { id: '1201', name: '應收帳款', type: '資產', side: 'debit' },
            { id: '1301', name: '存貨 (材料)', type: '資產', side: 'debit' },
            { id: '2101', name: '應付帳款', type: '負債', side: 'credit' },
            { id: '3101', name: '業主資本', type: '權益', side: 'credit' },
            { id: '4101', name: '銷貨收入', type: '收入', side: 'credit' },
            { id: '5101', name: '進貨成本', type: '成本', side: 'debit' },
            { id: '6101', name: '薪資費用', type: '費用', side: 'debit' },
            { id: '6102', name: '租金費用', type: '費用', side: 'debit' },
            { id: '6103', name: '水電瓦斯費', type: '費用', side: 'debit' },
            { id: '7101', name: '利息收入', type: '營業外收入', side: 'credit' },
            { id: '8101', name: '利息費用', type: '營業外費損', side: 'debit' },
        ];

        const DEFAULT_SETTINGS = {
            giftItems: [
                { id: uid(), name: '綜合', price: 1080, active: true, recipe: { 原味: 2, 可可: 2, 伯爵: 1, 抹茶: 1 }, category: 'gift' },
                { id: uid(), name: '原味', price: 360, active: true, recipe: { 原味: 3 }, category: 'gift' },
                { id: uid(), name: '可可', price: 360, active: true, recipe: { 可可: 3 }, category: 'gift' },
                { id: uid(), name: '伯爵', price: 360, active: true, recipe: { 伯爵: 3 }, category: 'gift' },
                { id: uid(), name: '抹茶', price: 360, active: true, recipe: { 抹茶: 3 }, category: 'gift' },
            ],
            singleItems: [
                { id: uid(), name: '原味', price: 120, active: true, category: 'single' },
                { id: uid(), name: '可可', price: 120, active: true, category: 'single' },
                { id: uid(), name: '伯爵', price: 120, active: true, category: 'single' },
                { id: uid(), name: '抹茶', price: 120, active: true, category: 'single' },
            ],
            packagingItems: [
                { id: uid(), name: '手提袋', price: 10, active: true },
                { id: uid(), name: '宅配紙箱', price: 15, active: true },
            ],
        };

        function uid() {
            return `id_${Math.random().toString(36).slice(2, 11)}`;
        }

        function todayISO() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function monthISO(date = new Date()) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        }

        function parseNum(v) {
            const n = Number(v);
            return Number.isFinite(n) ? n : 0;
        }

        function fmt(n) {
            return parseNum(n).toLocaleString('zh-TW');
        }

        function emptyDailyDoc(date) {
            return {
                date,
                orders: [newOrder()],
                ar: { accum: 0, collect: 0, logSpent: 0, actualTotal: 0 },
                inventory: {},
                losses: [],
                packagingUsage: {},
            };
        }

        function newOrder() {
            return {
                id: uid(),
                buyer: '',
                phone: '',
                address: '',
                items: {},
                prodAmt: 0,
                shipAmt: 0,
                discAmt: 0,
                actualAmt: 0,
                status: '匯款',
                note: '',
            };
        }

        function useDebouncedEffect(effect, deps, delay = 1000) {
            useEffect(() => {
                const t = setTimeout(effect, delay);
                return () => clearTimeout(t);
            }, deps);
        }

        function calcOrder(order, settings) {
            const allItems = [...settings.giftItems, ...settings.singleItems];
            const prodAmt = allItems.reduce((sum, item) => sum + (parseNum(order.items[item.id]) * parseNum(item.price)), 0);
            return {
                ...order,
                prodAmt,
                actualAmt: prodAmt + parseNum(order.shipAmt) - parseNum(order.discAmt),
            };
        }

        function getDailyMetrics(daily, settings) {
            const metrics = {
                rev: 0, ship: 0, disc: 0, prVal: 0, prShip: 0, receivable: 0, actualReceived: 0, remit: 0, cash: 0, unpaid: 0,
                giftSale: {}, giftPR: {}, singleSale: {}, singlePR: {},
            };
            settings.giftItems.forEach(i => {
                metrics.giftSale[i.name] = 0;
                metrics.giftPR[i.name] = 0;
            });
            settings.singleItems.forEach(i => {
                metrics.singleSale[i.name] = 0;
                metrics.singlePR[i.name] = 0;
            });
            (daily.orders || []).forEach(order => {
                const isPR = order.status === '公關品';
                metrics.rev += parseNum(order.prodAmt);
                metrics.disc += parseNum(order.discAmt);
                if (isPR) {
                    metrics.prVal += parseNum(order.prodAmt);
                    metrics.prShip += parseNum(order.shipAmt);
                } else {
                    metrics.ship += parseNum(order.shipAmt);
                    metrics.receivable += parseNum(order.actualAmt);
                    if (order.status === '匯款') {
                        metrics.remit += parseNum(order.actualAmt);
                        metrics.actualReceived += parseNum(order.actualAmt);
                    }
                    if (order.status === '現結') {
                        metrics.cash += parseNum(order.actualAmt);
                        metrics.actualReceived += parseNum(order.actualAmt);
                    }
                    if (order.status === '未結帳款') {
                        metrics.unpaid += parseNum(order.actualAmt);
                    }
                }
                settings.giftItems.forEach(i => {
                    const qty = parseNum(order.items[i.id]);
                    if (isPR) metrics.giftPR[i.name] += qty;
                    else metrics.giftSale[i.name] += qty;
                });
                settings.singleItems.forEach(i => {
                    const qty = parseNum(order.items[i.id]);
                    if (isPR) metrics.singlePR[i.name] += qty;
                    else metrics.singleSale[i.name] += qty;
                });
            });
            return metrics;
        }

        function getFlavorList(settings) {
            return Array.from(new Set(settings.singleItems.map(i => i.name)));
        }

        function computeInventoryRows(daily, settings, metrics) {
            const flavors = getFlavorList(settings);
            return flavors.map(flavor => {
                const inv = daily.inventory[flavor] || { org: 0, exp: 0, act: 0, los: 0 };
                const lossQty = (daily.losses || []).filter(l => l.flavor === flavor).reduce((s, l) => s + parseNum(l.qty), 0);
                let giftConsume = 0;
                settings.giftItems.forEach(gb => {
                    const sold = (metrics.giftSale[gb.name] || 0) + (metrics.giftPR[gb.name] || 0);
                    const recipeCount = parseNum(gb.recipe?.[flavor]);
                    giftConsume += sold * recipeCount;
                });
                const singleOut = (metrics.singleSale[flavor] || 0) + (metrics.singlePR[flavor] || 0);
                const out = giftConsume + singleOut;
                const remain = parseNum(inv.org) + parseNum(inv.act) - parseNum(lossQty) - out;
                const rate = parseNum(inv.act) > 0 ? (parseNum(lossQty) / parseNum(inv.act)) * 100 : 0;
                return { flavor, ...inv, los: lossQty, out, remain, rate };
            });
        }

        function monthDocs(allDaily, ym) {
            return Object.values(allDaily).filter(doc => doc.date && doc.date.startsWith(`${ym}-`));
        }

        function weekRange(dateStr) {
            const dt = new Date(dateStr);
            const d = dt.getDay();
            const diff = d === 0 ? -6 : 1 - d;
            const monday = new Date(dt);
            monday.setDate(dt.getDate() + diff);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            const toISO = (x) => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
            return { monday: toISO(monday), sunday: toISO(sunday) };
        }

        function PieChart({ title, labels, values, colors }) {
            const total = values.reduce((a, b) => a + b, 0) || 1;
            let startAngle = -Math.PI / 2;
            const slices = values.map((v, idx) => {
                const angle = (v / total) * Math.PI * 2;
                const end = startAngle + angle;
                const largeArc = angle > Math.PI ? 1 : 0;
                const r = 80;
                const cx = 110;
                const cy = 110;
                const x1 = cx + r * Math.cos(startAngle);
                const y1 = cy + r * Math.sin(startAngle);
                const x2 = cx + r * Math.cos(end);
                const y2 = cy + r * Math.sin(end);
                const d = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;
                startAngle = end;
                return { d, color: colors[idx], label: labels[idx], value: v };
            });
            return (
                <div className="glass-panel p-4">
                    <h3 className="font-bold mb-2">{title}</h3>
                    <div className="flex flex-col md:flex-row gap-4 items-center">
                        <svg width="220" height="220" viewBox="0 0 220 220">
                            {slices.map((s, i) => <path key={i} d={s.d} fill={s.color} stroke="#fff" strokeWidth="1" />)}
                            <circle cx="110" cy="110" r="38" fill="white" />
                        </svg>
                        <div className="text-sm w-full">
                            {slices.map((s, i) => (
                                <div key={i} className="flex justify-between mb-1">
                                    <span><span className="inline-block w-3 h-3 rounded mr-2" style={{ backgroundColor: s.color }}></span>{s.label}</span>
                                    <span className="font-semibold">{fmt(s.value)}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const persisted = useMemo(() => {
                try {
                    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                } catch {
                    return {};
                }
            }, []);

            const [mainTab, setMainTab] = useState('journal');
            const [dailySubTab, setDailySubTab] = useState('dashboard');
            const [selectedYear, setSelectedYear] = useState(persisted.selectedYear || 2026);
            const [currentDate, setCurrentDate] = useState(persisted.currentDate || todayISO());
            const [selectedMonth, setSelectedMonth] = useState(persisted.selectedMonth || monthISO());
            const [shopId, setShopId] = useState(persisted.shopId || 'tai_du_2025');
            const [firebaseConfig, setFirebaseConfig] = useState(persisted.firebaseConfig || EMPTY_FIREBASE_CONFIG);
            const [db, setDb] = useState(null);
            const [syncState, setSyncState] = useState('未連線');

            const [logo, setLogo] = useState(persisted.logo || '');
            const [showCrop, setShowCrop] = useState(false);
            const [tempImage, setTempImage] = useState('');

            const [coa, setCoa] = useState(persisted.coa || DEFAULT_COA);
            const [journalEntries, setJournalEntries] = useState(persisted.journalEntries || []);
            const [showVoucherModal, setShowVoucherModal] = useState(false);
            const [editingVoucher, setEditingVoucher] = useState(null);
            const [voucherImportPreview, setVoucherImportPreview] = useState([]);

            const [settings, setSettings] = useState(persisted.settings || DEFAULT_SETTINGS);
            const [allDaily, setAllDaily] = useState(persisted.allDaily || {});
            const [monthlyFixed, setMonthlyFixed] = useState(persisted.monthlyFixed || {});
            const [importPreview, setImportPreview] = useState([]);
            const [recipeTargetId, setRecipeTargetId] = useState(null);

            const [costFilter, setCostFilter] = useState('month');
            const [costCustomStart, setCostCustomStart] = useState(currentDate);
            const [costCustomEnd, setCostCustomEnd] = useState(currentDate);

            const daily = allDaily[currentDate] || emptyDailyDoc(currentDate);
            const metrics = useMemo(() => getDailyMetrics(daily, settings), [daily, settings]);
            const inventoryRows = useMemo(() => computeInventoryRows(daily, settings, metrics), [daily, settings, metrics]);

            const activeGiftItems = useMemo(() => settings.giftItems.filter(i => i.active), [settings]);
            const activeSingleItems = useMemo(() => settings.singleItems.filter(i => i.active), [settings]);
            const activePackagingItems = useMemo(() => settings.packagingItems.filter(i => i.active), [settings]);

            useEffect(() => {
                let cancelled = false;
                fetch('./firebase.json')
                    .then(r => r.ok ? r.json() : null)
                    .then(cfg => {
                        if (cancelled || !cfg) return;
                        if (cfg.shopId) setShopId(prev => prev || cfg.shopId);
                        if (cfg.firebaseConfig) {
                            setFirebaseConfig(prev => ({ ...EMPTY_FIREBASE_CONFIG, ...cfg.firebaseConfig, ...prev }));
                        }
                    })
                    .catch(() => { });
                return () => { cancelled = true; };
            }, []);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    selectedYear, currentDate, selectedMonth, shopId, firebaseConfig, logo, coa, journalEntries, settings, allDaily, monthlyFixed
                }));
            }, [selectedYear, currentDate, selectedMonth, shopId, firebaseConfig, logo, coa, journalEntries, settings, allDaily, monthlyFixed]);

            useEffect(() => {
                const hasConfig = firebaseConfig.apiKey && firebaseConfig.projectId && firebaseConfig.appId;
                if (!hasConfig) return;
                try {
                    const appName = `taidu-${firebaseConfig.projectId}`;
                    const app = firebase.apps.find(a => a.name === appName) || firebase.initializeApp(firebaseConfig, appName);
                    const firestore = firebase.firestore(app);
                    firestore.enablePersistence({ synchronizeTabs: true }).catch(() => { });
                    setDb(firestore);
                    setSyncState('已連線');
                } catch (e) {
                    console.error(e);
                    setSyncState('連線失敗');
                }
            }, [firebaseConfig]);

            async function pushMeta() {
                if (!db) return;
                setSyncState('同步中');
                try {
                    const shopRef = db.collection('shops').doc(shopId);
                    await shopRef.collection('meta').doc('settings').set({
                        logo, ownerEmail: OWNER_EMAIL, selectedYear, updatedAt: new Date().toISOString(),
                    }, { merge: true });
                    await shopRef.collection('meta').doc('settings').set({ settings }, { merge: true });
                    await shopRef.collection('meta').doc('coa').set({ list: coa }, { merge: true });
                    setSyncState('已同步');
                } catch (e) {
                    console.error(e);
                    setSyncState('同步失敗');
                }
            }

            async function pullCore() {
                if (!db) return;
                setSyncState('下載中');
                try {
                    const shopRef = db.collection('shops').doc(shopId);
                    const [metaSnap, coaSnap] = await Promise.all([
                        shopRef.collection('meta').doc('settings').get(),
                        shopRef.collection('meta').doc('coa').get(),
                    ]);
                    if (metaSnap.exists) {
                        const d = metaSnap.data();
                        if (d.logo) setLogo(d.logo);
                        if (d.settings) setSettings(d.settings);
                    }
                    if (coaSnap.exists && coaSnap.data().list) setCoa(coaSnap.data().list);
                    const entrySnap = await shopRef.collection('entries').where('year', '==', selectedYear).get();
                    setJournalEntries(entrySnap.docs.map(s => ({ id: s.id, ...s.data() })));
                    const dailySnap = await shopRef.collection('daily').get();
                    const loadedDaily = {};
                    dailySnap.forEach(doc => {
                        loadedDaily[doc.id] = { ...emptyDailyDoc(doc.id), ...doc.data(), date: doc.id };
                    });
                    setAllDaily(prev => ({ ...prev, ...loadedDaily }));
                    const monthSnap = await shopRef.collection('monthly').get();
                    const fixedMap = {};
                    monthSnap.forEach(doc => fixedMap[doc.id] = doc.data().fixed || {});
                    setMonthlyFixed(prev => ({ ...prev, ...fixedMap }));
                    setSyncState('已同步');
                } catch (e) {
                    console.error(e);
                    setSyncState('下載失敗');
                }
            }

            useDebouncedEffect(() => {
                if (!db) return;
                const day = allDaily[currentDate];
                if (!day) return;
                db.collection('shops').doc(shopId).collection('daily').doc(currentDate).set({ ...day, date: currentDate }, { merge: true })
                    .then(() => setSyncState('已同步'))
                    .catch(() => setSyncState('同步失敗'));
            }, [allDaily, currentDate, db, shopId], 1000);

            useDebouncedEffect(() => {
                if (!db) return;
                const fixed = monthlyFixed[selectedMonth];
                if (!fixed) return;
                db.collection('shops').doc(shopId).collection('monthly').doc(selectedMonth).set({
                    ym: selectedMonth,
                    fixed,
                    updatedAt: new Date().toISOString()
                }, { merge: true }).catch(() => setSyncState('同步失敗'));
            }, [monthlyFixed, selectedMonth, db, shopId], 1000);

            useDebouncedEffect(() => {
                pushMeta();
            }, [logo, coa, settings, selectedYear, db, shopId], 1000);

            useEffect(() => {
                if (allDaily[currentDate]) return;
                const y = new Date(currentDate);
                y.setDate(y.getDate() - 1);
                const yKey = `${y.getFullYear()}-${String(y.getMonth() + 1).padStart(2, '0')}-${String(y.getDate()).padStart(2, '0')}`;
                const yDoc = allDaily[yKey];
                const next = emptyDailyDoc(currentDate);
                if (yDoc) {
                    const yMetrics = getDailyMetrics(yDoc, settings);
                    next.ar.accum = parseNum(yDoc.ar?.accum) + parseNum(yMetrics.unpaid) - parseNum(yDoc.ar?.collect);
                    computeInventoryRows(yDoc, settings, yMetrics).forEach(r => {
                        next.inventory[r.flavor] = { org: r.remain, exp: 0, act: 0, los: 0 };
                    });
                }
                setAllDaily(prev => ({ ...prev, [currentDate]: next }));
            }, [currentDate, allDaily, settings]);

            function updateDaily(mutator) {
                setAllDaily(prev => {
                    const base = prev[currentDate] || emptyDailyDoc(currentDate);
                    const next = mutator(JSON.parse(JSON.stringify(base)));
                    return { ...prev, [currentDate]: next };
                });
            }

            function patchOrder(orderId, patch) {
                updateDaily(doc => {
                    doc.orders = doc.orders.map(o => {
                        if (o.id !== orderId) return o;
                        return calcOrder({ ...o, ...patch }, settings);
                    });
                    return doc;
                });
            }

            function addOrderRow() {
                updateDaily(doc => {
                    doc.orders.push(newOrder());
                    return doc;
                });
            }

            function removeOrderRow(orderId) {
                updateDaily(doc => {
                    if (doc.orders.length === 1) return doc;
                    doc.orders = doc.orders.filter(o => o.id !== orderId);
                    return doc;
                });
            }

            function saveVoucher(voucher) {
                const balanced = Math.abs(parseNum(voucher.debitTotal) - parseNum(voucher.creditTotal)) < 0.01;
                if (!balanced) {
                    alert('借貸不平衡，請調整後再儲存');
                    return;
                }
                const normalized = {
                    ...voucher,
                    year: Number(voucher.date.slice(0, 4)),
                    updatedAt: new Date().toISOString(),
                };
                setJournalEntries(prev => {
                    const exists = prev.some(v => v.id === normalized.id);
                    const next = exists ? prev.map(v => v.id === normalized.id ? normalized : v) : [normalized, ...prev];
                    return next.sort((a, b) => (a.date < b.date ? 1 : -1));
                });
                if (db) {
                    db.collection('shops').doc(shopId).collection('entries').doc(normalized.id).set(normalized, { merge: true });
                }
                setShowVoucherModal(false);
                setEditingVoucher(null);
            }

            function deleteVoucher(id) {
                if (!confirm('確定刪除此傳票？')) return;
                setJournalEntries(prev => prev.filter(v => v.id !== id));
                if (db) db.collection('shops').doc(shopId).collection('entries').doc(id).delete();
            }

            function addCoa() {
                const id = prompt('科目編號');
                const name = prompt('科目名稱');
                const type = prompt('科目類型（資產/負債/權益/收入/成本/費用）', '費用');
                const side = prompt('正常餘額（debit/credit）', 'debit');
                if (!id || !name) return;
                if (coa.some(c => c.id === id)) {
                    alert('科目編號已存在');
                    return;
                }
                setCoa(prev => [...prev, { id, name, type, side }].sort((a, b) => a.id.localeCompare(b.id)));
            }

            function deleteCoa(id) {
                const used = journalEntries.some(e => e.lines.some(l => l.accountId === id));
                if (used) {
                    alert('此科目已有交易不可刪除');
                    return;
                }
                setCoa(prev => prev.filter(c => c.id !== id));
            }

            function onLogoPick(e) {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    setTempImage(ev.target.result);
                    setShowCrop(true);
                };
                reader.readAsDataURL(file);
            }

            function importOrdersFromRows(rows) {
                if (!rows.length) return [];
                const headers = rows[0].map(x => String(x || '').trim());
                const dataRows = rows.slice(1).filter(r => r.some(c => String(c || '').trim()));
                const idxByKeywords = (keys) => headers.findIndex(h => keys.some(k => h.includes(k)));
                const idxName = idxByKeywords(['姓名', '訂購人']);
                const idxPhone = idxByKeywords(['手機', '電話']);
                const idxDate = idxByKeywords(['日期', '出貨', '取貨']);
                const idxAddr = idxByKeywords(['地址']);

                const allItems = [...settings.giftItems, ...settings.singleItems];
                const itemCols = [];
                headers.forEach((h, colIdx) => {
                    const item = allItems.find(i => h.includes(i.name));
                    if (item) itemCols.push({ colIdx, item });
                });
                const parsed = [];
                dataRows.forEach(row => {
                    const dateCell = row[idxDate];
                    let date = '';
                    if (typeof dateCell === 'number' && Number.isFinite(dateCell)) {
                        const excelEpoch = new Date(Date.UTC(1899, 11, 30));
                        const d = new Date(excelEpoch.getTime() + dateCell * 86400000);
                        date = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
                    } else {
                        const dateRaw = String(dateCell || '').replace(/\//g, '-').trim();
                        const dateMatch = dateRaw.match(/\d{4}-\d{1,2}-\d{1,2}/);
                        if (dateMatch) {
                            date = dateMatch[0].split('-').map((x, i) => i ? x.padStart(2, '0') : x).join('-');
                        }
                    }
                    if (!date) return;
                    const items = {};
                    let prodAmt = 0;
                    itemCols.forEach(({ colIdx, item }) => {
                        const txt = String(row[colIdx] || '');
                        const num = parseNum((txt.match(/\d+/) || [0])[0]);
                        if (num > 0) {
                            items[item.id] = num;
                            prodAmt += num * parseNum(item.price);
                        }
                    });
                    if (!Object.keys(items).length) return;
                    parsed.push({
                        date,
                        buyer: idxName >= 0 ? String(row[idxName] || '').trim() : '未命名',
                        phone: idxPhone >= 0 ? String(row[idxPhone] || '').trim() : '',
                        address: idxAddr >= 0 ? String(row[idxAddr] || '').trim() : '',
                        items,
                        prodAmt,
                    });
                });
                return parsed;
            }

            function confirmImportOrders() {
                if (!importPreview.length) return;
                setAllDaily(prev => {
                    const next = { ...prev };
                    importPreview.forEach(po => {
                        const d = next[po.date] || emptyDailyDoc(po.date);
                        d.orders = [
                            ...(d.orders || []),
                            {
                                id: uid(),
                                buyer: po.buyer,
                                phone: po.phone,
                                address: po.address,
                                items: po.items,
                                prodAmt: po.prodAmt,
                                shipAmt: 0,
                                discAmt: 0,
                                actualAmt: po.prodAmt,
                                status: '匯款',
                                note: '',
                            }
                        ];
                        next[po.date] = d;
                    });
                    return next;
                });
                setImportPreview([]);
            }

            function exportMonthlyExcel() {
                const docs = monthDocs(allDaily, selectedMonth);
                const rows = [];
                docs.forEach(doc => {
                    (doc.orders || []).forEach(order => {
                        rows.push({
                            日期: doc.date,
                            訂購人: order.buyer,
                            商品營業總額: order.prodAmt,
                            運費: order.shipAmt,
                            折讓: order.discAmt,
                            應收: order.actualAmt,
                            付款方式: order.status,
                        });
                    });
                });
                if (!rows.length) {
                    alert('本月暫無資料');
                    return;
                }
                const ws = XLSX.utils.json_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '月報表');
                XLSX.writeFile(wb, `態度貳貳_月報_${selectedMonth}.xlsx`);
            }

            function exportCostExcel(summaryRows) {
                const ws = XLSX.utils.json_to_sheet(summaryRows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '成本分析');
                XLSX.writeFile(wb, `態度貳貳_成本分析_${selectedMonth}.xlsx`);
            }

            const journalYearEntries = useMemo(() => journalEntries.filter(e => parseNum(e.year) === selectedYear), [journalEntries, selectedYear]);
            const weeklyRange = weekRange(currentDate);
            const weeklyCards = useMemo(() => {
                const out = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(weeklyRange.monday);
                    d.setDate(d.getDate() + i);
                    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    const day = allDaily[key];
                    if (!day?.orders?.length) continue;
                    out.push({ date: key, orders: day.orders.filter(o => o.buyer || o.actualAmt > 0) });
                }
                return out;
            }, [allDaily, weeklyRange]);

            const monthReport = useMemo(() => {
                const docs = monthDocs(allDaily, selectedMonth);
                const fixed = monthlyFixed[selectedMonth] || {};
                let rev = 0, ship = 0, disc = 0, pr = 0, remit = 0, cash = 0, ar = 0;
                let shippingSpend = 0, packageCost = 0, ingredientCost = 0;
                const productAgg = {};
                const lossAgg = {};

                docs.forEach(doc => {
                    const m = getDailyMetrics(doc, settings);
                    rev += m.rev;
                    ship += m.ship;
                    disc += m.disc;
                    pr += m.prVal;
                    remit += m.remit;
                    cash += m.cash;
                    ar += m.unpaid;
                    shippingSpend += parseNum(doc.ar?.logSpent);
                    settings.packagingItems.forEach(p => {
                        packageCost += parseNum(doc.packagingUsage?.[p.id]) * parseNum(p.price);
                    });
                    [...settings.giftItems, ...settings.singleItems].forEach(item => {
                        const qty = (doc.orders || []).reduce((s, o) => s + parseNum(o.items[item.id]), 0);
                        if (!productAgg[item.name]) productAgg[item.name] = { name: item.name, qty: 0, price: item.price, revenue: 0, gross: 0, category: item.category };
                        productAgg[item.name].qty += qty;
                        productAgg[item.name].revenue += qty * parseNum(item.price);
                    });
                    (doc.losses || []).forEach(l => {
                        if (!lossAgg[l.flavor]) lossAgg[l.flavor] = { flavor: l.flavor, 人為: 0, 技術: 0, 過期: 0, 吃掉: 0, total: 0 };
                        lossAgg[l.flavor][l.type] += parseNum(l.qty);
                        lossAgg[l.flavor].total += parseNum(l.qty);
                    });
                });

                Object.values(productAgg).forEach(p => {
                    const unitCost = p.category === 'gift' ? 420 : 45;
                    ingredientCost += p.qty * unitCost;
                    p.gross = p.revenue - p.qty * unitCost;
                });
                const fixedTotal = ['rent', 'util', 'staff', 'maint', 'misc', 'ads'].reduce((s, k) => s + parseNum(fixed[k]), 0);
                const variable = ingredientCost + packageCost + shippingSpend;
                const net = rev - variable - fixedTotal;
                return {
                    rev, ship, disc, pr, remit, cash, ar, shippingSpend, ingredientCost, packageCost, variable, fixedTotal, net,
                    products: Object.values(productAgg), losses: Object.values(lossAgg), docs,
                };
            }, [allDaily, selectedMonth, monthlyFixed, settings]);

            const costDocs = useMemo(() => {
                if (costFilter === 'month') return monthDocs(allDaily, selectedMonth);
                if (costFilter === 'ytd') {
                    const [y] = selectedMonth.split('-');
                    return Object.values(allDaily).filter(d => d.date?.startsWith(`${y}-`));
                }
                return Object.values(allDaily).filter(d => d.date >= costCustomStart && d.date <= costCustomEnd);
            }, [costFilter, selectedMonth, allDaily, costCustomStart, costCustomEnd]);

            const costSummary = useMemo(() => {
                let rev = 0, material = 0, packageCost = 0, logistics = 0;
                const itemDist = {};
                const itemRows = {};
                costDocs.forEach(doc => {
                    const m = getDailyMetrics(doc, settings);
                    rev += m.rev - m.disc;
                    logistics += parseNum(doc.ar?.logSpent);
                    settings.packagingItems.forEach(p => packageCost += parseNum(doc.packagingUsage?.[p.id]) * parseNum(p.price));
                    [...settings.giftItems, ...settings.singleItems].forEach(item => {
                        const qty = (doc.orders || []).reduce((s, o) => s + parseNum(o.items[item.id]), 0);
                        if (!qty) return;
                        if (!itemDist[item.name]) itemDist[item.name] = 0;
                        itemDist[item.name] += qty;
                        if (!itemRows[item.name]) itemRows[item.name] = { name: item.name, qty: 0, price: item.price, material: 0, packaging: 0, gross: 0, margin: 0 };
                        itemRows[item.name].qty += qty;
                    });
                });
                Object.values(itemRows).forEach(r => {
                    r.material = r.qty * (r.price >= 360 ? 70 : 25);
                    r.packaging = r.qty * (r.price >= 360 ? 15 : 4);
                    r.gross = r.qty * r.price - r.material - r.packaging;
                    r.margin = r.price ? ((r.price - (r.material / Math.max(r.qty, 1)) - (r.packaging / Math.max(r.qty, 1))) / r.price) * 100 : 0;
                    material += r.material;
                });
                const fixed = monthlyFixed[selectedMonth] || {};
                const fixedTotal = ['rent', 'util', 'staff', 'maint', 'misc', 'ads'].reduce((s, k) => s + parseNum(fixed[k]), 0);
                const variable = material + packageCost + logistics;
                const pretax = rev - variable - fixedTotal;
                const grossRate = rev ? ((rev - variable) / rev) * 100 : 0;
                const netRate = rev ? (pretax / rev) * 100 : 0;
                return { rev, material, packageCost, logistics, fixedTotal, variable, pretax, grossRate, netRate, itemDist, rows: Object.values(itemRows) };
            }, [costDocs, settings, monthlyFixed, selectedMonth]);

            return (
                <div className="p-3 md:p-6">
                    <div className="max-w-[1600px] mx-auto space-y-4">
                        <header className="glass-panel p-4 md:p-5">
                            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

                                    <label className="w-20 h-20 rounded-xl border border-coffee-200 overflow-hidden bg-white flex items-center justify-center cursor-pointer">
                                        {logo ? <img src={logo} alt="logo" className="w-full h-full object-cover" /> : <span className="text-xs text-gray-500 text-center">上傳 Logo</span>}
                                        <input type="file" accept="image/*" className="hidden" onChange={onLogoPick} />
                                    </label>
                                    <div>
                                        <h1 className="text-xl md:text-3xl font-bold text-coffee-600">態度貳貳日記簿</h1>
                                        <p className="text-xs md:text-sm text-gray-500">{OWNER_EMAIL}</p>
                                        <p className="text-xs text-gray-400">雲端狀態：{syncState}</p>
                                    </div>
                                </div>
                                <div className="flex flex-wrap items-center gap-2 text-sm">
                                    <select className="px-3 py-2 rounded-lg border" value={selectedYear} onChange={(e) => setSelectedYear(parseNum(e.target.value))}>
                                        {YEAR_OPTIONS.map(y => <option key={y} value={y}>{y} 年度</option>)}
                                    </select>
                                    <input type="date" className="px-3 py-2 rounded-lg border" value={currentDate} onChange={(e) => setCurrentDate(e.target.value)} />
                                    <input type="month" className="px-3 py-2 rounded-lg border" value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} />
                                    <button className="px-3 py-2 rounded-lg bg-coffee-600 text-white" onClick={pullCore}><i className="fa-solid fa-download mr-1"></i>同步</button>
                                </div>
                            </div>
                            <div className="mt-3 text-sm text-gray-500">
                                Firebase 設定來源：<code>firebase.json</code>（固定） / Shop ID：<code>{shopId}</code>
                            </div>
                        </header>

                        <nav className="glass-panel p-2 flex gap-2 overflow-x-auto no-scrollbar">
                            {[
                                ['journal', '日記簿'],
                                ['daily', '日報表'],
                                ['monthly', '月報表'],
                                ['cost', '成本分析'],
                            ].map(([key, label]) => (
                                <button key={key} className={`px-4 py-2 rounded-lg whitespace-nowrap ${mainTab === key ? 'bg-coffee-600 text-white' : 'bg-white text-gray-700'}`} onClick={() => setMainTab(key)}>{label}</button>
                            ))}
                        </nav>

                        {mainTab === 'journal' && (
                            <section className="space-y-4">
                                <div className="glass-panel p-4">
                                    <div className="flex flex-wrap justify-between items-center gap-2">
                                        <h2 className="font-bold text-lg">日記簿（會計傳票）</h2>
                                        <div className="flex gap-2">
                                            <button className="px-3 py-2 rounded bg-coffee-600 text-white" onClick={() => { setEditingVoucher(null); setShowVoucherModal(true); }}>新增傳票</button>
                                            <label className="px-3 py-2 rounded border bg-white cursor-pointer">Excel 匯入
                                                <input type="file" className="hidden" accept=".xlsx,.xls" onChange={async (e) => {
                                                    const f = e.target.files?.[0];
                                                    if (!f) return;
                                                    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
                                                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                                                    const imported = importOrdersFromRows(rows).map(r => ({
                                                        id: uid(),
                                                        date: r.date,
                                                        year: parseNum(r.date.slice(0, 4)),
                                                        voucherNo: `JV-${r.date.replaceAll('-', '')}-${Math.floor(Math.random() * 900 + 100)}`,
                                                        description: `Excel匯入 ${r.buyer} ${r.phone} ${r.address}`,
                                                        lines: [
                                                            { id: uid(), type: 'debit', accountId: '1201', amount: r.prodAmt },
                                                            { id: uid(), type: 'credit', accountId: '4101', amount: r.prodAmt },
                                                        ],
                                                        debitTotal: r.prodAmt,
                                                        creditTotal: r.prodAmt,
                                                    }));
                                                    setVoucherImportPreview(imported);
                                                }} />
                                            </label>
                                        </div>
                                    </div>
                                    {voucherImportPreview.length > 0 && (
                                        <div className="mt-3 p-3 rounded bg-white">
                                            <div className="flex justify-between">
                                                <span>待匯入傳票 {voucherImportPreview.length} 筆</span>
                                                <button className="px-3 py-1 rounded bg-coffee-600 text-white" onClick={() => {
                                                    setJournalEntries(prev => [...voucherImportPreview, ...prev].sort((a, b) => a.date < b.date ? 1 : -1));
                                                    if (db) {
                                                        const batch = db.batch();
                                                        voucherImportPreview.forEach(v => {
                                                            batch.set(db.collection('shops').doc(shopId).collection('entries').doc(v.id), v, { merge: true });
                                                        });
                                                        batch.commit();
                                                    }
                                                    setVoucherImportPreview([]);
                                                }}>確認匯入</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div className="glass-panel p-3 overflow-auto no-scrollbar">
                                    <table className="w-full mobile-table">
                                        <thead>
                                            <tr className="text-left border-b">
                                                <th className="p-2">日期</th><th className="p-2">憑證號</th><th className="p-2">說明</th><th className="p-2 text-right">借方</th><th className="p-2 text-right">貸方</th><th className="p-2">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {journalYearEntries.map(e => (
                                                <React.Fragment key={e.id}>
                                                    <tr className="border-b bg-white">
                                                        <td className="p-2">{e.date}</td>
                                                        <td className="p-2">{e.voucherNo}</td>
                                                        <td className="p-2">{e.description}</td>
                                                        <td className="p-2 text-right">{fmt(e.debitTotal)}</td>

                                                    <tr className="bg-gray-50">
                                                        <td colSpan="6" className="p-2">
                                                            <div className="grid md:grid-cols-2 gap-2 text-xs">
                                                                {(e.lines || []).map(l => (
                                                                    <div key={l.id}>{l.type === 'debit' ? '借' : '貸'} | {l.accountId} {coa.find(c => c.id === l.accountId)?.name || ''} | {fmt(l.amount)}</div>
                                                                ))}
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </React.Fragment>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="glass-panel p-4">
                                    <div className="flex justify-between items-center mb-2">
                                        <h3 className="font-bold">會計科目管理</h3>
                                        <button className="px-2 py-1 rounded bg-coffee-600 text-white" onClick={addCoa}>新增科目</button>
                                    </div>
                                    <table className="w-full text-sm">
                                        <thead><tr><th className="text-left p-1">編號</th><th className="text-left p-1">名稱</th><th className="text-left p-1">類型</th><th className="text-left p-1">餘額方向</th><th></th></tr></thead>
                                        <tbody>{coa.map(c => (
                                            <tr key={c.id} className="border-b">
                                                <td className="p-1">{c.id}</td>
                                                <td className="p-1">{c.name}</td>

                                            </tr>
                                        ))}</tbody>
                                    </table>
                                </div>
                            </section>
                        )}

                        {mainTab === 'daily' && (
                            <section className="space-y-4">
                                <div className="glass-panel p-2 flex gap-2 overflow-x-auto no-scrollbar">
                                    {[
                                        ['dashboard', '銷售明細 & 戰情室'],

                                {dailySubTab === 'dashboard' && (
                                    <>
                                        <div className="glass-panel p-4">

                                                <button className="px-3 py-1 rounded bg-[var(--primary)] text-white" onClick={addOrderRow}>新增訂單</button>
                                            </div>
                                            <div className="overflow-auto no-scrollbar">
                                                <table className="w-full mobile-table text-center">
                                                    <thead>
                                                        <tr>
                                                            <th className="p-1">訂購人</th>
                                                            <th className="p-1">電話</th>
                                                            {activeGiftItems.map(i => <th key={i.id} className="p-1">{i.name}禮盒</th>)}
                                                            {activeSingleItems.map(i => <th key={i.id} className="p-1">{i.name}</th>)}
                                                            <th className="p-1">商品總額</th><th className="p-1">運費</th><th className="p-1">折讓</th><th className="p-1">實收</th><th className="p-1">付款</th><th className="p-1">備註</th><th className="p-1">操作</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {daily.orders.map(o => (
                                                            <tr key={o.id} className="border-b bg-white">
                                                                <td className="p-1"><input className="w-20 border rounded px-1" value={o.buyer} onChange={e => patchOrder(o.id, { buyer: e.target.value })} /></td>
                                                                <td className="p-1"><input className="w-24 border rounded px-1" value={o.phone || ''} onChange={e => patchOrder(o.id, { phone: e.target.value })} /></td>
                                                                {activeGiftItems.map(i => (
                                                                    <td key={i.id} className="p-1"><input type="number" className="w-14 border rounded px-1 text-center" value={parseNum(o.items[i.id])} onChange={e => patchOrder(o.id, { items: { ...o.items, [i.id]: parseNum(e.target.value) } })} /></td>
                                                                ))}
                                                                {activeSingleItems.map(i => (
                                                                    <td key={i.id} className="p-1"><input type="number" className="w-14 border rounded px-1 text-center" value={parseNum(o.items[i.id])} onChange={e => patchOrder(o.id, { items: { ...o.items, [i.id]: parseNum(e.target.value) } })} /></td>
                                                                ))}
                                                                <td className="p-1">{fmt(o.prodAmt)}</td>
                                                                <td className="p-1"><input type="number" className="w-16 border rounded px-1 text-center" value={parseNum(o.shipAmt)} onChange={e => patchOrder(o.id, { shipAmt: parseNum(e.target.value) })} /></td>
                                                                <td className="p-1"><input type="number" className="w-16 border rounded px-1 text-center" value={parseNum(o.discAmt)} onChange={e => patchOrder(o.id, { discAmt: parseNum(e.target.value) })} /></td>
                                                                <td className="p-1">{fmt(o.actualAmt)}</td>
                                                                <td className="p-1">
                                                                    <select className="border rounded px-1" value={o.status} onChange={e => patchOrder(o.id, { status: e.target.value })}>
                                                                        <option>匯款</option><option>現結</option><option>未結帳款</option><option>公關品</option>
                                                                    </select>
                                                                </td>
                                                                <td className="p-1"><input className="w-24 border rounded px-1" value={o.note || ''} onChange={e => patchOrder(o.id, { note: e.target.value })} /></td>
                                                                <td className="p-1"><button className="text-red-600" onClick={() => removeOrderRow(o.id)}>刪</button></td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <div className="grid md:grid-cols-3 gap-3">
                                            <div className="glass-panel p-4 text-sm bg-white/70">
                                                <h4 className="font-bold mb-2">金流總結</h4>

                                    <button className="mt-3 px-3 py-2 rounded bg-coffee-600 text-white" onClick={() => exportCostExcel(costSummary.rows.map(r => ({
                                        品項: r.name, 銷售量: r.qty, 售價: r.price, 食材成本: r.material, 包材成本: r.packaging, 毛利: r.gross, 毛利率: `${r.margin.toFixed(1)}%`
                                    })))}>匯出成本分析 Excel</button>
                                </div>
                            </section>
                        )}
                    </div>

                    {showVoucherModal && (
                        <VoucherModal
                            coa={coa}
                            initial={editingVoucher}
                            year={selectedYear}
                            onClose={() => { setShowVoucherModal(false); setEditingVoucher(null); }}
                            onSave={saveVoucher}
                        />
                    )}

                    {recipeTargetId && (
                        <RecipeModal
                            settings={settings}
                            targetId={recipeTargetId}
                            onClose={() => setRecipeTargetId(null)}
                            onSave={(recipe) => {
                                setSettings(prev => ({
                                    ...prev,
                                    giftItems: prev.giftItems.map(g => g.id === recipeTargetId ? { ...g, recipe } : g),
                                }));
                                setRecipeTargetId(null);
                            }}
                        />
                    )}

                    {showCrop && (
                        <LogoCropper
                            image={tempImage}
                            onCancel={() => setShowCrop(false)}
                            onCrop={(dataUrl) => { setLogo(dataUrl); setShowCrop(false); }}
                        />
                    )}
                </div>
            );
        }

        function KpiCard({ title, value, danger, highlight }) {
            return (
                <div className={`glass-panel p-4 text-center ${highlight ? 'border-2 border-[var(--primary)]' : ''}`}>
                    <div className="text-sm mb-1">{title}</div>
                    <div className={`text-2xl font-bold ${danger ? 'text-red-600' : highlight ? 'text-[var(--primary)]' : ''}`}>{fmt(value)}</div>
                </div>
            );
        }

        function SettingsTable({ title, items, onChange, withRecipe = false, onSetRecipe }) {
            function addItem() {
                onChange([...items, { id: uid(), name: '新品項', price: 0, active: true, recipe: {}, category: withRecipe ? 'gift' : 'single' }]);
            }
            function patch(id, patch) {
                onChange(items.map(i => i.id === id ? { ...i, ...patch } : i));
            }
            function remove(id) {
                if (!confirm('確定刪除？')) return;
                onChange(items.filter(i => i.id !== id));
            }
            return (
                <div className="glass-panel p-4">
                    <div className="flex justify-between mb-2">
                        <h3 className="font-bold">{title}</h3>
                        <button className="px-3 py-1 rounded bg-[var(--primary)] text-white" onClick={addItem}>新增</button>
                    </div>
                    <table className="w-full text-sm bg-white">
                        <thead><tr><th className="text-left p-1">上架</th><th className="text-left p-1">名稱</th><th>價格</th>{withRecipe && <th>配方</th>}<th></th></tr></thead>
                        <tbody>{items.map(i => (
                            <tr key={i.id} className="border-t">
                                <td className="p-1 text-center"><input type="checkbox" checked={!!i.active} onChange={e => patch(i.id, { active: e.target.checked })} /></td>
                                <td className="p-1"><input className="w-full border rounded px-1" value={i.name} onChange={e => patch(i.id, { name: e.target.value })} /></td>
                                <td className="p-1 text-center"><input type="number" className="w-24 border rounded px-1 text-right" value={parseNum(i.price)} onChange={e => patch(i.id, { price: parseNum(e.target.value) })} /></td>
                                {withRecipe && <td className="p-1 text-center"><button className="px-2 py-1 rounded border" onClick={() => onSetRecipe(i.id)}>配方</button></td>}
                                <td className="p-1 text-right"><button className="text-red-600" onClick={() => remove(i.id)}>刪除</button></td>
                            </tr>
                        ))}</tbody>
                    </table>
                </div>
            );
        }

        function RecipeModal({ settings, targetId, onClose, onSave }) {
            const target = settings.giftItems.find(g => g.id === targetId);
            const [recipe, setRecipe] = useState(target?.recipe || {});
            if (!target) return null;
            return (
                <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-xl p-4 w-full max-w-md">
                        <h3 className="font-bold mb-2">設定「{target.name}」配方</h3>
                        <div className="space-y-2">
                            {settings.singleItems.map(s => (
                                <label key={s.id} className="flex justify-between items-center">
                                    <span>{s.name}</span>
                                    <input type="number" className="w-20 border rounded px-1 text-right" value={parseNum(recipe[s.name])} onChange={e => setRecipe({ ...recipe, [s.name]: parseNum(e.target.value) })} />
                                </label>
                            ))}
                        </div>
                        <div className="mt-3 flex justify-end gap-2">
                            <button className="px-3 py-1 rounded border" onClick={onClose}>取消</button>
                            <button className="px-3 py-1 rounded bg-[var(--primary)] text-white" onClick={() => onSave(recipe)}>儲存</button>
                        </div>
                    </div>
                </div>
            );
        }

        function VoucherModal({ coa, initial, year, onClose, onSave }) {
            const [data, setData] = useState(initial || {
                id: uid(),
                date: `${year}-01-01`,
                voucherNo: `JV-${Date.now()}`,
                description: '',
                lines: [
                    { id: uid(), type: 'debit', accountId: coa[0]?.id || '1101', amount: 0 },
                    { id: uid(), type: 'credit', accountId: coa[1]?.id || '4101', amount: 0 },
                ],
            });
            const debitTotal = data.lines.filter(l => l.type === 'debit').reduce((s, l) => s + parseNum(l.amount), 0);
            const creditTotal = data.lines.filter(l => l.type === 'credit').reduce((s, l) => s + parseNum(l.amount), 0);
            return (
                <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-xl p-4 w-full max-w-3xl max-h-[90vh] overflow-auto">
                        <h3 className="font-bold mb-3">{initial ? '編輯傳票' : '新增傳票'}</h3>
                        <div className="grid md:grid-cols-3 gap-2 mb-3">
                            <input type="date" className="border rounded px-2 py-1" value={data.date} onChange={e => setData({ ...data, date: e.target.value })} />
                            <input className="border rounded px-2 py-1" placeholder="憑證號" value={data.voucherNo} onChange={e => setData({ ...data, voucherNo: e.target.value })} />
                            <input className="border rounded px-2 py-1 md:col-span-1" placeholder="說明" value={data.description} onChange={e => setData({ ...data, description: e.target.value })} />
                        </div>
                        <table className="w-full text-sm">
                            <thead><tr><th className="p-1">借貸</th><th>科目</th><th>金額</th><th></th></tr></thead>
                            <tbody>{data.lines.map(line => (
                                <tr key={line.id} className="border-t">
                                    <td className="p-1"><select className="border rounded px-1" value={line.type} onChange={e => setData({ ...data, lines: data.lines.map(l => l.id === line.id ? { ...l, type: e.target.value } : l) })}><option value="debit">借</option><option value="credit">貸</option></select></td>
                                    <td className="p-1"><select className="border rounded px-1 w-full" value={line.accountId} onChange={e => setData({ ...data, lines: data.lines.map(l => l.id === line.id ? { ...l, accountId: e.target.value } : l) })}>{coa.map(a => <option key={a.id} value={a.id}>{a.id} {a.name}</option>)}</select></td>
                                    <td className="p-1"><input type="number" className="w-full border rounded px-1 text-right" value={parseNum(line.amount)} onChange={e => setData({ ...data, lines: data.lines.map(l => l.id === line.id ? { ...l, amount: parseNum(e.target.value) } : l) })} /></td>
                                    <td className="p-1 text-right"><button className="text-red-600" onClick={() => setData({ ...data, lines: data.lines.filter(l => l.id !== line.id) })}>刪除</button></td>
                                </tr>
                            ))}</tbody>
                        </table>
                        <button className="mt-2 px-3 py-1 rounded border" onClick={() => setData({ ...data, lines: [...data.lines, { id: uid(), type: 'debit', accountId: coa[0]?.id || '1101', amount: 0 }] })}>新增列</button>
                        <div className="mt-3 text-sm flex justify-between">
                            <span>借方合計：<b>{fmt(debitTotal)}</b></span>
                            <span>貸方合計：<b>{fmt(creditTotal)}</b></span>
                            <span className={Math.abs(debitTotal - creditTotal) < 0.01 ? 'text-green-700' : 'text-red-600'}>{Math.abs(debitTotal - creditTotal) < 0.01 ? '已平衡' : '未平衡'}</span>
                        </div>
                        <div className="mt-4 flex justify-end gap-2">
                            <button className="px-3 py-1 rounded border" onClick={onClose}>取消</button>
                            <button className="px-3 py-1 rounded bg-coffee-600 text-white" onClick={() => onSave({ ...data, debitTotal, creditTotal, year: parseNum(data.date.slice(0, 4)) })}>儲存</button>
                        </div>
                    </div>
                </div>
            );
        }

        function LogoCropper({ image, onCrop, onCancel }) {
            const [zoom, setZoom] = useState(1);
            const [pos, setPos] = useState({ x: 50, y: 50 });
            const imgRef = useRef(null);

            function handleSave() {
                const img = imgRef.current;
                if (!img) return;
                const canvas = document.createElement('canvas');
                canvas.width = 400;
                canvas.height = 400;
                const ctx = canvas.getContext('2d');
                const w = img.naturalWidth * zoom;
                const h = img.naturalHeight * zoom;
                const dx = 200 - (pos.x / 100) * w;
                const dy = 200 - (pos.y / 100) * h;
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, 400, 400);
                ctx.drawImage(img, dx, dy, w, h);
                onCrop(canvas.toDataURL('image/png'));
            }

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-xl p-4 w-full max-w-lg">
                        <h3 className="font-bold mb-2">裁切 Logo（400x400）</h3>
                        <div
                            className="w-full aspect-square bg-gray-100 border rounded overflow-hidden relative cursor-move"
                            onMouseMove={(e) => {
                                if (e.buttons !== 1) return;
                                const rect = e.currentTarget.getBoundingClientRect();
                                setPos({
                                    x: Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100)),
                                    y: Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100)),
                                });
                            }}
                            onWheel={(e) => {
                                e.preventDefault();
                                setZoom(z => Math.max(0.3, Math.min(4, z + (e.deltaY > 0 ? -0.08 : 0.08))));
                            }}
                        >
                            <img
                                ref={imgRef}
                                src={image}
                                alt="crop"
                                className="absolute w-full h-full object-contain pointer-events-none"
                                style={{ transform: `translate(${50 - pos.x}%, ${50 - pos.y}%) scale(${zoom})`, transformOrigin: 'center center' }}
                            />
                            <div className="absolute inset-0 border-2 border-[var(--primary)] pointer-events-none"></div>
                        </div>
                        <div className="mt-3 flex justify-between items-center text-sm">
                            <span>滾輪縮放 / 拖曳定位</span>
                            <input type="range" min="0.3" max="4" step="0.05" value={zoom} onChange={e => setZoom(parseNum(e.target.value))} />
                        </div>
                        <div className="mt-3 flex justify-end gap-2">
                            <button className="px-3 py-1 rounded border" onClick={onCancel}>取消</button>
                            <button className="px-3 py-1 rounded bg-coffee-600 text-white" onClick={handleSave}>套用</button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
